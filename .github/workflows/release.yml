name: Release

# A tag vX.Y.Z publishes that version to both stores. The tag must match
# package.json, and CHANGELOG.md must have a section for it: that section is
# the GitHub Release's notes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Serialised across the whole repository: two publishes racing would leave one
# version permanently unusable, since a store never reissues a version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          manifest="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "::error::tag v$version disagrees with package.json $manifest"
            exit 1
          fi
          node scripts/changelog-section.mjs "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: plan
    uses: ./.github/workflows/ci.yml

  # One package, built once, published to each store by a job of its own: an
  # outage at one store does not hold the version back from the other, and
  # re-running the failed job retries only that store. Both install the same
  # bytes.
  package:
    name: Package ${{ needs.plan.outputs.version }}
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vsce package --no-dependencies --out "hermitile-${{ needs.plan.outputs.version }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: hermitile-${{ needs.plan.outputs.version }}
          path: hermitile-*.vsix
          retention-days: 90

  marketplace:
    name: Visual Studio Marketplace ${{ needs.plan.outputs.version }}
    needs: [plan, package]
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: hermitile-${{ needs.plan.outputs.version }}
      - run: npx vsce publish --packagePath "hermitile-${{ needs.plan.outputs.version }}.vsix"

  # Where the forks install from: Cursor, VSCodium, Windsurf.
  openvsx:
    name: Open VSX ${{ needs.plan.outputs.version }}
    needs: [plan, package]
    runs-on: ubuntu-24.04
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: hermitile-${{ needs.plan.outputs.version }}
      - run: npx ovsx publish --packagePath "hermitile-${{ needs.plan.outputs.version }}.vsix" --pat "$OVSX_PAT"

  # Gated on both stores: a GitHub Release announces that a version is out, and
  # announcing one nobody can install from their editor would be a lie.
  release:
    name: GitHub Release ${{ needs.plan.outputs.version }}
    needs: [plan, marketplace, openvsx]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hermitile-${{ needs.plan.outputs.version }}
      - run: |
          set -euo pipefail
          node scripts/changelog-section.mjs "$VERSION" > /tmp/notes.md
          gh release create "v$VERSION" "hermitile-$VERSION.vsix" --title "HermiTile $VERSION" --notes-file /tmp/notes.md
